kubernetes-mcp-server:
  openshift: true

  ingress:
    enabled: true
    host: ""  # Set via --set ingress.host=... or Makefile

  rbac:
    extraClusterRoleBindings:
      - name: use-view-role
        roleRef:
          name: view
          external: true

  # Toolsets to enable (TOML array format)
  # Available: core, config, helm, netobserv, tekton, kubevirt, kiali, kcp
  config:
    toolsets:
      - core
      - helm
