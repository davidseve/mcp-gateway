apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    - name: mcp
      hostname: {{ .Values.gateway.listeners.mcp.hostname }}
      port: {{ .Values.gateway.listeners.mcp.port }}
      protocol: {{ .Values.gateway.listeners.mcp.protocol }}
      allowedRoutes:
        namespaces:
          from: All
    - name: mcps
      hostname: "*.mcp.local"
      port: {{ .Values.gateway.listeners.mcps.port }}
      protocol: {{ .Values.gateway.listeners.mcps.protocol }}
      allowedRoutes:
        namespaces:
          from: All
