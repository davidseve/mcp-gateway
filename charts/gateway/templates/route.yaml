{{- if eq .Values.exposure.mode "route" }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.route.name }}
  namespace: {{ .Release.Namespace }}
  {{- if eq .Values.route.tlsTermination "reencrypt" }}
  annotations:
    router.openshift.io/service-ca-certificate: "true"
  {{- end }}
spec:
  host: {{ .Values.route.host | default .Values.gateway.listeners.mcp.hostname | quote }}
  port:
    targetPort: {{ .Values.gateway.listeners.mcp.tls.port | default 443 | quote }}
  tls:
    termination: {{ .Values.route.tlsTermination }}
    {{- if eq .Values.route.tlsTermination "reencrypt" }}
    insecureEdgeTerminationPolicy: Redirect
    {{- end }}
  to:
    kind: Service
    name: {{ .Values.gateway.name }}-{{ .Values.gateway.gatewayClassName }}
    weight: 100
  wildcardPolicy: None
{{- end }}
