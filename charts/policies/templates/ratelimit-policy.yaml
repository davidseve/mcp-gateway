{{- if .Values.rateLimitPolicy.enabled }}
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: {{ .Values.rateLimitPolicy.name }}
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
  limits:
    global:
      rates:
        - limit: {{ .Values.rateLimitPolicy.limits.requestsPerMinute }}
          window: 1min
{{- end }}
