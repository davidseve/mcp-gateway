{{- if .Values.authPolicy.enabled }}
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: {{ .Values.authPolicy.name }}
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
  defaults:
    when:
      - predicate: "!request.path.contains('/.well-known')"
    rules:
      authentication:
        {{- if .Values.authPolicy.apiKey.enabled }}
        api-key:
          apiKey:
            selector:
              matchLabels:
                {{- range $label := splitList "," .Values.authPolicy.apiKey.secretLabels }}
                {{- $parts := splitList "=" $label }}
                {{ index $parts 0 }}: {{ index $parts 1 | quote }}
                {{- end }}
          credentials:
            authorizationHeader:
              prefix: Bearer
        {{- end }}
{{- end }}
