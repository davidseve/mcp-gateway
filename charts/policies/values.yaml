gateway:
  name: mcp-gateway
  namespace: gateway-system

authPolicy:
  enabled: true
  name: mcp-gateway-auth
  apiKey:
    enabled: true
    secretLabels: "mcp.kuadrant.io/secret=true"

rateLimitPolicy:
  enabled: true
  name: mcp-gateway-ratelimit
  limits:
    requestsPerMinute: 60
    burst:
      enabled: true
      requestsPerSecond: 10
    perIdentity:
      enabled: false
      requestsPerMinute: 30

# MCPVirtualServer — curated tool subsets for different client profiles.
# Each entry creates an MCPVirtualServer CR. Clients select a view via
# X-Mcp-Virtualserver header. Empty list = no virtual servers (all tools visible).
# Note: discovery-only filtering; does NOT block tools/call. For execution-level
# filtering, combine with AuthPolicy wristband (Phase 5).
virtualServers: []
